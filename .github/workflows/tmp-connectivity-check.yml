name: tmp-connectivity-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Curl new cluster ingress (port 80, acme-challenge path)
        run: |
          echo "Runner netwerk info:"
          curl -s https://ifconfig.me ; echo
          echo "--- poort 80 test ---"
          curl -v --max-time 15 http://app.demo.alexhensen.com/.well-known/acme-challenge/diagnostic-test || true
          echo "--- poort 443 test ---"
          curl -sk -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 https://app.demo.alexhensen.com/ || true
          echo "--- direct IP test poort 80 ---"
          curl -v --max-time 15 http://9.163.186.85/ -H "Host: app.demo.alexhensen.com" || true
